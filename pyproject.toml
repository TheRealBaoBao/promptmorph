[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "promptmorph"
version = "0.1.0"
description = "One-shot physical prompting with object-relative, closed-loop replanning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Henry Bao" }]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
sim = ["mujoco>=3.2,<4"]
ml = ["torch>=2.4,<3"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
promptmorph-demo = "promptmorph.cli:main"
promptmorph-mujoco-demo = "promptmorph.sim.mujoco_demo:main"
promptmorph-train-progress = "promptmorph.learning.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptmorph"]

[tool.hatch.build.targets.wheel.force-include]
"src/promptmorph/sim/assets/franka_tabletop.xml" = "promptmorph/sim/assets/franka_tabletop.xml"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["promptmorph"]
